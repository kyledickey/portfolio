name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test-go
      - run: make build-server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: make test-web
      - run: make build-web

  docker:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t portfolio .
      - name: Smoke test
        run: |
          docker run -d --name portfolio -p 8080:8080 portfolio
          for i in $(seq 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
          curl -sf localhost:8080/ | grep -q 'Kyle Dickey'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/nope)" = 404
          docker logs portfolio
